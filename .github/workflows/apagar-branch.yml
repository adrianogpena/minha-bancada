name: Apagar a branch depois do merge

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  apagar:
    # só PR que foi mesclado e veio deste repositório (nunca de fork), e nunca as branches principais
    if: github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref != 'master' && github.event.pull_request.head.ref != 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Apagar a branch pela API (o job não faz checkout)
        env:
          GH_TOKEN: ${{ github.token }}
          RAMO: ${{ github.event.pull_request.head.ref }}
        run: gh api --method DELETE "repos/${{ github.repository }}/git/refs/heads/$RAMO"
