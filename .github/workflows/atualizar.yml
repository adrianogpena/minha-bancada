name: Atualizar dados e publicar site

on:
  schedule:
    - cron: "17 9 * * *"   # todo dia às 09:17 UTC (06:17 em Brasília)
  workflow_dispatch:        # permite rodar manualmente pela aba Actions
  push:
    branches: [master]
    paths: ["site/**", "scripts/**", ".github/workflows/**"]

permissions:
  contents: write   # salvar o cache de dados no repositório
  pages: write
  id-token: write

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Coletar dados da Câmara
        run: python scripts/coletar.py

      - name: Coletar eleitos do TSE (só baixa de novo o que mudou)
        run: python scripts/coletar_tse.py
        env:
          TSE_DIAG: "1"

      - name: Gerar arquivos do site
        run: python scripts/gerar.py

      - name: Salvar histórico no repositório
        # votações, proposições e eleitos do TSE ficam no git (crescem aos poucos); o resto é baixado de novo a cada execução
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/votacoes/ dados/proposicoes/ dados/tse/
          git diff --cached --quiet || git commit -m "Dados atualizados em $(date -u +%Y-%m-%d)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
