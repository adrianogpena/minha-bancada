name: Atualizar dados e publicar site

on:
  schedule:
    - cron: "47 7 * * *"   # todo dia às 07:47 UTC (04:47 em Brasília), fora da hora cheia
  workflow_dispatch:        # coleta completa manual (ex.: coletor novo); mudanças de código sem coleta vão pelo republicar.yml

permissions:
  contents: write   # salvar o cache de dados no repositório
  issues: write   # abrir o aviso quando a develop não sincroniza com a master
  pages: write
  id-token: write

env:
  TZ: America/Sao_Paulo   # date.today() dos coletores segue o dia de Brasília, também em execução manual à noite

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  # As coletas leem fontes diferentes e não dependem umas das outras: rodam ao mesmo tempo, cada uma num job.
  # Cada job entrega um pacote (.tgz, guardado por 3 dias para o republicar.yml) com o que gravou; o job `publicar` junta tudo, gera o site e publica.
  camara:
    name: Coletar Câmara dos Deputados
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restaurar a ficha dos deputados da execução anterior
        # dados/deputados/ não vai para o git; sem isto todo dia relê tudo e o escalonamento de complementos (1 + id % 7 dias) não vale
        uses: actions/cache/restore@v4
        with:
          path: dados/deputados
          key: deputados-${{ github.run_id }}
          restore-keys: deputados-

      - name: Marcar o início (só o que for gravado depois disso vai no pacote)
        run: touch "$RUNNER_TEMP/inicio"

      - name: Coletar deputados da Câmara
        run: python scripts/coletar.py --so deputados

      - name: Coletar votações da Câmara
        run: python scripts/coletar.py --so votacoes

      - name: Coletar proposições da Câmara
        run: python scripts/coletar.py --so proposicoes

      - name: Coletar o resumo das leis citadas nas proposições
        run: python scripts/coletar_leis.py
        continue-on-error: true

      - name: Guardar a ficha dos deputados (mesmo se a coleta falhar, para a próxima execução não recomeçar do zero)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: dados/deputados
          key: deputados-${{ github.run_id }}

      - name: Empacotar o resultado
        if: always()
        run: scripts/empacotar.sh "$RUNNER_TEMP/camara.tgz" "$RUNNER_TEMP/inicio" dados/deputados dados/deputados.json dados/proposicoes dados/proposicoes_cadastro dados/proposicoes_detalhe.json dados/proposicoes_autores.json dados/proposicoes_temas.json dados/leis.json dados/orgaos_deputados.json dados/orientacoes.json dados/blocos.json dados/proposicoes_votacoes.json dados/presenca_eventos.json dados/camara_recursos.json dados/votacoes dados/meta.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pacote-camara
          path: ${{ runner.temp }}/camara.tgz
          if-no-files-found: ignore
          retention-days: 3

  senado:
    name: Coletar Senado
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Marcar o início (só o que for gravado depois disso vai no pacote)
        run: touch "$RUNNER_TEMP/inicio"

      - name: Coletar Senado (senadores, votações, autorias, CEAPS, recursos, comissões e mandatos)
        run: python scripts/coletar.py --so senado

      - name: Empacotar o resultado
        if: always()
        run: scripts/empacotar.sh "$RUNNER_TEMP/senado.tgz" "$RUNNER_TEMP/inicio" dados/senado.json dados/senado_votacoes dados/senado_materias.json dados/senado_autorias.json dados/senado_ceaps.json dados/senado_recursos.json dados/senado_aposentados.json dados/senado_ficha.json dados/senado_atividade.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pacote-senado
          path: ${{ runner.temp }}/senado.tgz
          if-no-files-found: ignore
          retention-days: 3

  tse:
    name: Coletar eleitos do TSE
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Marcar o início (só o que for gravado depois disso vai no pacote)
        run: touch "$RUNNER_TEMP/inicio"

      - name: Coletar eleitos do TSE (só baixa de novo o que mudou)
        run: python scripts/coletar_tse.py

      - name: Empacotar o resultado
        if: always()
        run: scripts/empacotar.sh "$RUNNER_TEMP/tse.tgz" "$RUNNER_TEMP/inicio" dados/tse site/fotos

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pacote-tse
          path: ${{ runner.temp }}/tse.tgz
          if-no-files-found: ignore
          retention-days: 3

  executivo:
    name: Coletar o que o Presidente enviou ao Congresso
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Marcar o início (só o que for gravado depois disso vai no pacote)
        run: touch "$RUNNER_TEMP/inicio"

      - name: Coletar o que o Presidente enviou ao Congresso
        run: python scripts/coletar_executivo.py
        continue-on-error: true

      - name: Empacotar o resultado
        if: always()
        run: scripts/empacotar.sh "$RUNNER_TEMP/executivo.tgz" "$RUNNER_TEMP/inicio" dados/executivo.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pacote-executivo
          path: ${{ runner.temp }}/executivo.tgz
          if-no-files-found: ignore
          retention-days: 3

  ministros:
    name: Coletar ministros de Estado
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Marcar o início (só o que for gravado depois disso vai no pacote)
        run: touch "$RUNNER_TEMP/inicio"

      - name: Coletar ministros, requerimentos a ministros e licenças de parlamentares
        run: python scripts/coletar_ministros.py
        env:
          MINISTROS_PRAZO_MIN: "25"   # tramitações que não couberem ficam para o dia seguinte
        continue-on-error: true

      - name: Coletar a composição dos tribunais superiores
        run: python scripts/coletar_tribunais.py
        continue-on-error: true

      - name: Coletar relatorias do TCU e do STJ (fontes oficiais)
        run: python scripts/coletar_relatorias.py
        env:
          TRIBUNAIS_PRAZO_MIN: "20"
        continue-on-error: true

      - name: Empacotar o resultado
        if: always()
        run: scripts/empacotar.sh "$RUNNER_TEMP/ministros.tgz" "$RUNNER_TEMP/inicio" dados/ministros dados/tribunais

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pacote-ministros
          path: ${{ runner.temp }}/ministros.tgz
          if-no-files-found: ignore
          retention-days: 3

  estaduais:
    name: Coletar Assembleia ${{ matrix.rotulo }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # cada Assembleia fora do SAPL tem site próprio e ritmo próprio: um job por UF, para uma lenta não segurar as outras
        include:
          - { id: sapl, ufs: "PB AM AL RO AC PI TO", rotulo: "PB, AM, AL, RO, AC, PI e TO (SAPL)" }   # Assembleias que usam o SAPL (API igual, coleta rápida)
          - { id: ba, ufs: "BA", rotulo: "BA" }
          - { id: ce, ufs: "CE", rotulo: "CE" }
          - { id: es, ufs: "ES", rotulo: "ES" }
          - { id: go, ufs: "GO", rotulo: "GO" }
          - { id: mg, ufs: "MG", rotulo: "MG" }
          - { id: ms, ufs: "MS", rotulo: "MS" }
          - { id: mt, ufs: "MT", rotulo: "MT" }
          - { id: pa, ufs: "PA", rotulo: "PA" }
          - { id: pe, ufs: "PE", rotulo: "PE" }
          - { id: pr, ufs: "PR", rotulo: "PR" }
          - { id: rj, ufs: "RJ", rotulo: "RJ" }
          - { id: rn, ufs: "RN", rotulo: "RN" }
          - { id: rr, ufs: "RR", rotulo: "RR" }
          - { id: rs, ufs: "RS", rotulo: "RS" }
          - { id: sc, ufs: "SC", rotulo: "SC" }
          - { id: se, ufs: "SE", rotulo: "SE" }
          - { id: sp, ufs: "SP", rotulo: "SP" }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Marcar o início (só o que for gravado depois disso vai no pacote)
        run: touch "$RUNNER_TEMP/inicio"

      - name: Coletar Assembleias Legislativas (deputados estaduais, ${{ matrix.ufs }})
        # ESTADUAIS_PRAZO_MIN: depois de 25 min o coletor não faz novas requisições, guarda o que já leu e termina; o timeout do passo é só a rede de segurança
        run: python scripts/coletar_estaduais.py ${{ matrix.ufs }}
        env:
          ESTADUAIS_PRAZO_MIN: "25"
        timeout-minutes: 30
        continue-on-error: true

      - name: Empacotar o resultado
        if: always()
        run: scripts/empacotar.sh "$RUNNER_TEMP/estaduais-${{ matrix.id }}.tgz" "$RUNNER_TEMP/inicio" dados/estaduais

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pacote-estaduais-${{ matrix.id }}
          path: ${{ runner.temp }}/estaduais-${{ matrix.id }}.tgz
          if-no-files-found: ignore
          retention-days: 3

  governadores:
    name: Coletar governadores (SAPL)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Marcar o início (só o que for gravado depois disso vai no pacote)
        run: touch "$RUNNER_TEMP/inicio"

      - name: Coletar o que os governadores enviaram às Assembleias (SAPL)
        run: python scripts/coletar_governadores.py
        timeout-minutes: 45
        continue-on-error: true

      - name: Empacotar o resultado
        if: always()
        run: scripts/empacotar.sh "$RUNNER_TEMP/governadores.tgz" "$RUNNER_TEMP/inicio" dados/estaduais

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pacote-governadores
          path: ${{ runner.temp }}/governadores.tgz
          if-no-files-found: ignore
          retention-days: 3

  tcu:
    name: Coletar inabilitados e inidôneos (TCU)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Marcar o início (só o que for gravado depois disso vai no pacote)
        run: touch "$RUNNER_TEMP/inicio"

      - name: Coletar inabilitados e inidôneos pelo TCU
        run: python scripts/coletar_tcu.py
        continue-on-error: true

      - name: Empacotar o resultado
        if: always()
        run: scripts/empacotar.sh "$RUNNER_TEMP/tcu.tgz" "$RUNNER_TEMP/inicio" dados/tcu

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pacote-tcu
          path: ${{ runner.temp }}/tcu.tgz
          if-no-files-found: ignore
          retention-days: 3

  emendas:
    name: Coletar emendas parlamentares (Portal da Transparência)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Marcar o início (só o que for gravado depois disso vai no pacote)
        run: touch "$RUNNER_TEMP/inicio"

      - name: Coletar emendas pelo Portal da Transparência
        # anos encerrados vêm do git (dados/emendas); o ano passado e o corrente são relidos
        run: python scripts/coletar_emendas.py
        continue-on-error: true
        env:
          PORTAL_TRANSPARENCIA_CHAVE: ${{ secrets.PORTAL_TRANSPARENCIA_CHAVE }}
          ESTADUAIS_PRAZO_MIN: "30"

      - name: Empacotar o resultado
        if: always()
        run: scripts/empacotar.sh "$RUNNER_TEMP/emendas.tgz" "$RUNNER_TEMP/inicio" dados/emendas

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pacote-emendas
          path: ${{ runner.temp }}/emendas.tgz
          if-no-files-found: ignore
          retention-days: 3

  siconfi:
    name: Coletar finanças dos estados (SICONFI)
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Marcar o início (só o que for gravado depois disso vai no pacote)
        run: touch "$RUNNER_TEMP/inicio"

      - name: Coletar despesa com pessoal e limites da LRF por Poder (RGF do SICONFI)
        run: python scripts/coletar_siconfi.py
        timeout-minutes: 25
        continue-on-error: true

      - name: Coletar despesa das Câmaras Municipais (DCA do SICONFI, incremental)
        run: python scripts/coletar_siconfi_municipios.py
        timeout-minutes: 30
        continue-on-error: true
        env:
          ESTADUAIS_PRAZO_MIN: "25"

      - name: Empacotar o resultado
        if: always()
        run: scripts/empacotar.sh "$RUNNER_TEMP/siconfi.tgz" "$RUNNER_TEMP/inicio" dados/siconfi dados/siconfi_municipios

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pacote-siconfi
          path: ${{ runner.temp }}/siconfi.tgz
          if-no-files-found: ignore
          retention-days: 3

  prefeituras:
    name: Coletar prefeitos das capitais (SAPL)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Marcar o início (só o que for gravado depois disso vai no pacote)
        run: touch "$RUNNER_TEMP/inicio"

      - name: Coletar o que os prefeitos das capitais enviaram às Câmaras (SAPL)
        run: python scripts/coletar_prefeituras.py
        timeout-minutes: 30
        continue-on-error: true

      - name: Empacotar o resultado
        if: always()
        run: scripts/empacotar.sh "$RUNNER_TEMP/prefeituras.tgz" "$RUNNER_TEMP/inicio" dados/municipais

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pacote-prefeituras
          path: ${{ runner.temp }}/prefeituras.tgz
          if-no-files-found: ignore
          retention-days: 3

  publicar:
    name: Gerar o site e publicar
    needs: [camara, senado, tse, executivo, ministros, estaduais, governadores, tcu, emendas, siconfi, prefeituras]
    # Publica com o que deu certo (histórico, RSS e e-mail saem mesmo se uma coleta falhar); só não publica se todas falharam
    if: ${{ !cancelled() && contains(needs.*.result, 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PUSH_TOKEN }}   # push como o administrador: a regra da master exige os testes e só o admin passa por cima (o GITHUB_TOKEN não entra na lista de exceções)

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: actions/download-artifact@v8
        with:
          pattern: pacote-*
          path: ${{ runner.temp }}/pacotes
          merge-multiple: true

      - name: Juntar o resultado das coletas
        run: |
          for pacote in "$RUNNER_TEMP"/pacotes/*.tgz; do
            [ -e "$pacote" ] && tar xzf "$pacote"
          done
          true

      - name: Testar as APIs e fontes (alimenta a lista de status em "Sobre os dados")
        continue-on-error: true   # sem o teste o site ainda publica, com o status do dia anterior
        run: python scripts/testar_endpoints.py --sem-tabela || true

      - name: Baixar as malhas dos mapas (IBGE) para site/geo
        # sem as malhas o site cai na API do IBGE pelo navegador de cada visitante
        continue-on-error: true
        run: python scripts/baixar_malhas.py

      - name: Gerar arquivos do site
        run: python scripts/gerar.py

      - name: Salvar histórico no repositório
        # votações, proposições e eleitos do TSE ficam no git (crescem aos poucos); o resto é baixado de novo a cada execução
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # só adiciona o que existe; um caminho ausente (coleta que falhou) derrubaria o passo
          for f in dados/votacoes dados/proposicoes dados/proposicoes_cadastro dados/proposicoes_detalhe.json dados/proposicoes_autores.json dados/proposicoes_temas.json dados/orgaos_deputados.json dados/orientacoes.json dados/blocos.json dados/proposicoes_votacoes.json dados/presenca_eventos.json dados/senado_votacoes dados/senado_materias.json dados/executivo.json dados/ministros dados/tribunais dados/estaduais dados/emendas dados/siconfi dados/siconfi_municipios dados/municipais dados/tse dados/status_apis.json; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          git diff --cached --quiet || git commit -m "Dados atualizados em $(TZ=America/Sao_Paulo date +%Y-%m-%d)"
          git pull --rebase -q origin master   # a coleta dura horas: um push de outra origem nesse meio tempo recusaria o nosso
          git push

      - name: Registrar o histórico diário (todos os detalhes do dia, com fontes, em dados/historico)
        # compara os dados antes e depois do commit do dia; a página historico.html lê o resultado. Roda antes dos e-mails e do RSS, que apontam para ela
        continue-on-error: true   # sem histórico o site ainda publica
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --deepen=50 -q || true
          # hora em que a execução começou de fato (o agendamento pode atrasar horas), não a do cron
          if INICIO=$(gh run view "$GITHUB_RUN_ID" --json startedAt --jq .startedAt) && COLETA_INICIO=$(TZ=America/Sao_Paulo date -d "$INICIO" +%Y-%m-%dT%H:%M:%S%:z); then export COLETA_INICIO; fi
          python scripts/historico.py
          git add dados/historico
          git diff --cached --quiet || git commit -m "Histórico diário de $(TZ=America/Sao_Paulo date +%Y-%m-%d)"   # o dia do histórico é o dia da coleta
          git pull --rebase -q origin master
          git push

      - name: Sincronizar a develop com a master (dados do dia e commits de merge)
        # a develop é a branch de integração das sessões; sem isso ela fica com dados velhos. Usa uma worktree à parte para não mexer no checkout dos passos seguintes
        continue-on-error: true   # conflito ou falha aqui deixa a develop como estava e não impede a publicação
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git ls-remote --exit-code --heads origin develop > /dev/null; then echo "Sem develop no remoto; pulando."; exit 0; fi
          sincronizar() {
            git fetch -q --shallow-since="90 days ago" origin master develop || return 1
            rm -rf "$RUNNER_TEMP/develop"
            git worktree add -q -B develop "$RUNNER_TEMP/develop" origin/develop || return 1
            git -C "$RUNNER_TEMP/develop" merge --no-edit -q -m "Sincroniza a develop com a master" origin/master || { git -C "$RUNNER_TEMP/develop" merge --abort 2> /dev/null; return 1; }
            git -C "$RUNNER_TEMP/develop" push -q origin develop
          }
          # a primeira tentativa usa histórico raso; sem base comum nele, baixa o histórico inteiro e repete
          avisar() {
            echo "::warning::Não foi possível sincronizar a develop com a master (conflito?); resolva à mão."
            titulo="A develop não sincronizou com a master"
            corpo="O passo de sincronização do workflow não conseguiu juntar a master na develop (provável conflito). Execução: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Resolva à mão: git checkout develop && git merge origin/master && git push origin develop. A issue fecha sozinha quando a sincronização voltar a funcionar."
            aberta=$(gh issue list --state open --search "\"$titulo\" in:title" --json number --jq '.[0].number')
            if [ -n "$aberta" ]; then gh issue comment "$aberta" --body "$corpo" || true; else gh issue create --title "$titulo" --body "$corpo" || true; fi
          }
          if ! sincronizar; then
            git worktree remove --force "$RUNNER_TEMP/develop" 2> /dev/null || true
            git fetch -q --unshallow origin || true
            sincronizar || { avisar; exit 1; }
          fi
          aberta=$(gh issue list --state open --search "\"A develop não sincronizou com a master\" in:title" --json number --jq '.[0].number')
          if [ -n "$aberta" ]; then gh issue close "$aberta" --comment "Sincronização restabelecida." || true; fi
          git worktree remove --force "$RUNNER_TEMP/develop" 2> /dev/null || true

      - name: Atualizar os feeds RSS do Fique informado (últimos 14 dias, a partir do histórico git)
        continue-on-error: true   # sem feeds o site ainda publica
        run: |
          git fetch --shallow-since="20 days ago" -q origin master
          python scripts/feeds.py --dias 14

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5

      - name: Enviar resumo do que mudou por e-mail (com link para o histórico diário)
        # depois do deploy, para o link do histórico já estar no ar; só na execução agendada (pushes e execuções manuais não enviam); exige os segredos SMTP_* e EMAIL_PARA; falha aqui não derruba a publicação
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USUARIO: ${{ secrets.SMTP_USUARIO }}
          SMTP_SENHA: ${{ secrets.SMTP_SENHA }}
          EMAIL_PARA: ${{ secrets.EMAIL_PARA }}
        run: |
          if [ -z "$SMTP_HOST" ]; then echo "Segredos de e-mail não configurados; pulando."; exit 0; fi
          git fetch --deepen=50 -q || true
          DEPOIS=$(git log -1 --grep='^Dados atualizados em' --format=%H)
          # sem commit de hoje (nada mudou), não reenvia o de ontem
          [ -n "$DEPOIS" ] && [ "$(TZ=America/Sao_Paulo git log -1 --format=%cd --date=format-local:%F "$DEPOIS")" = "$(TZ=America/Sao_Paulo date +%F)" ] && python scripts/resumo_email.py "$DEPOIS~1" "$DEPOIS" --enviar

      - name: Enviar avisos aos assinantes de "Fique informado" (e-mails cifrados)
        # só na execução agendada; a chave privada decifra os cadastros só na memória deste passo (assinaturas/LEIAME.md); falha aqui não derruba a publicação
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USUARIO: ${{ secrets.SMTP_USUARIO }}
          SMTP_SENHA: ${{ secrets.SMTP_SENHA }}
          ASSINANTES_URL: ${{ secrets.ASSINANTES_URL }}
          ASSINANTES_CHAVE: ${{ secrets.ASSINANTES_CHAVE }}
          ASSINANTES_CHAVE_PRIVADA: ${{ secrets.ASSINANTES_CHAVE_PRIVADA }}
        run: |
          if [ -z "$SMTP_HOST" ] || [ -z "$ASSINANTES_URL" ]; then echo "Segredos de assinantes não configurados; pulando."; exit 0; fi
          git fetch --shallow-since="70 days ago" -q origin master || true   # o aviso mensal compara com o início do mês anterior
          DEPOIS=$(git log -1 --grep='^Dados atualizados em' --format=%H)
          # sem commit de hoje (nada mudou), não manda aviso; confirmações pendentes esperam o próximo dia com dados
          [ -n "$DEPOIS" ] && [ "$(TZ=America/Sao_Paulo git log -1 --format=%cd --date=format-local:%F "$DEPOIS")" = "$(TZ=America/Sao_Paulo date +%F)" ] && python scripts/assinaturas.py "$DEPOIS~1" "$DEPOIS" --enviar
