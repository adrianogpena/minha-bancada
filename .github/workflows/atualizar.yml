name: Atualizar dados e publicar site

on:
  schedule:
    - cron: "17 9 * * *"   # todo dia às 09:17 UTC (06:17 em Brasília)
  workflow_dispatch:        # permite rodar manualmente pela aba Actions
  push:
    branches: [master]
    paths: ["site/**", "scripts/**", ".github/workflows/**"]

permissions:
  contents: write   # salvar o cache de dados no repositório
  pages: write
  id-token: write

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Coletar dados da Câmara
        run: python scripts/coletar.py

      - name: Coletar eleitos do TSE (só baixa de novo o que mudou)
        run: python scripts/coletar_tse.py

      - name: Coletar o que o Presidente enviou ao Congresso
        run: python scripts/coletar_executivo.py
        continue-on-error: true

      - name: Coletar Assembleias que usam o SAPL (deputados estaduais e governadores)
        run: |
          python scripts/coletar_estaduais.py
          python scripts/coletar_governadores.py
        timeout-minutes: 45
        continue-on-error: true

      - name: Coletar o que os prefeitos das capitais enviaram às Câmaras (SAPL)
        run: python scripts/coletar_prefeituras.py
        timeout-minutes: 30
        continue-on-error: true

      - name: Gerar arquivos do site
        run: python scripts/gerar.py

      - name: Salvar histórico no repositório
        # votações, proposições e eleitos do TSE ficam no git (crescem aos poucos); o resto é baixado de novo a cada execução
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # só adiciona o que existe; um caminho ausente (coleta que falhou) derrubaria o passo
          for f in dados/votacoes dados/proposicoes dados/proposicoes_detalhe.json dados/proposicoes_autores.json dados/senado_votacoes dados/senado_materias.json dados/executivo.json dados/estaduais dados/municipais dados/tse; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          git diff --cached --quiet || git commit -m "Dados atualizados em $(date -u +%Y-%m-%d)"
          git push

      - name: Registrar o histórico diário (todos os detalhes do dia, com fontes, em dados/historico)
        # compara os dados antes e depois do commit do dia; a página historico.html lê o resultado. Roda antes dos e-mails e do RSS, que apontam para ela
        continue-on-error: true   # sem histórico o site ainda publica
        run: |
          git fetch --deepen=50 -q || true
          python scripts/historico.py
          git add dados/historico
          git diff --cached --quiet || git commit -m "Histórico diário de $(date -u +%Y-%m-%d)"
          git push

      - name: Atualizar os feeds RSS do Fique informado (últimos 14 dias, a partir do histórico git)
        continue-on-error: true   # sem feeds o site ainda publica
        run: |
          git fetch --shallow-since="20 days ago" -q origin master
          python scripts/feeds.py --dias 14

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Enviar resumo do que mudou por e-mail (com link para o histórico diário)
        # depois do deploy, para o link do histórico já estar no ar; só na execução agendada (pushes e execuções manuais não enviam); exige os segredos SMTP_* e EMAIL_PARA; falha aqui não derruba a publicação
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USUARIO: ${{ secrets.SMTP_USUARIO }}
          SMTP_SENHA: ${{ secrets.SMTP_SENHA }}
          EMAIL_PARA: ${{ secrets.EMAIL_PARA }}
        run: |
          if [ -z "$SMTP_HOST" ]; then echo "Segredos de e-mail não configurados; pulando."; exit 0; fi
          git fetch --deepen=50 -q || true
          DEPOIS=$(git log -1 --grep='^Dados atualizados em' --format=%H)
          # sem commit de hoje (nada mudou), não reenvia o de ontem
          [ -n "$DEPOIS" ] && [ "$(git log -1 --format=%cs "$DEPOIS")" = "$(date -u +%F)" ] && python scripts/resumo_email.py "$DEPOIS~1" "$DEPOIS" --enviar

      - name: Enviar avisos aos assinantes de "Fique informado" (e-mails cifrados)
        # só na execução agendada; a chave privada decifra os cadastros só na memória deste passo (assinaturas/LEIAME.md); falha aqui não derruba a publicação
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USUARIO: ${{ secrets.SMTP_USUARIO }}
          SMTP_SENHA: ${{ secrets.SMTP_SENHA }}
          ASSINANTES_URL: ${{ secrets.ASSINANTES_URL }}
          ASSINANTES_CHAVE: ${{ secrets.ASSINANTES_CHAVE }}
          ASSINANTES_CHAVE_PRIVADA: ${{ secrets.ASSINANTES_CHAVE_PRIVADA }}
        run: |
          if [ -z "$SMTP_HOST" ] || [ -z "$ASSINANTES_URL" ]; then echo "Segredos de assinantes não configurados; pulando."; exit 0; fi
          git fetch --deepen=50 -q || true
          DEPOIS=$(git log -1 --grep='^Dados atualizados em' --format=%H)
          # sem commit de hoje (nada mudou), não manda aviso; confirmações pendentes esperam o próximo dia com dados
          [ -n "$DEPOIS" ] && [ "$(git log -1 --format=%cs "$DEPOIS")" = "$(date -u +%F)" ] && python scripts/assinaturas.py "$DEPOIS~1" "$DEPOIS" --enviar
