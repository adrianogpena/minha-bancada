name: Testar APIs das Assembleias

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Sondar MT
        run: |
          UA="Mozilla/5.0 (compatible; minha-bancada; projeto de transparencia)"
          B=https://api.al.mt.gov.br/api/v1
          pegar() {
            echo "=== $1"
            curl -sS -k -L -m 30 -o /tmp/resp.txt -w "%{http_code} %{content_type} %{size_download}B\n" -A "$UA" -H "Accept: application/json" "$B/$1" 2>&1 || true
            head -c "${2:-600}" /tmp/resp.txt 2>/dev/null | tr '\n' ' '
            echo
          }
          for r in ssl/parlamentar ssl/legislatura ssl/proposicao ssl/sessao-plenaria ssl/sessao-plenaria/proposicao-votada ssl/ordem-dia; do
            pegar "$r" 700
          done
          echo "##### documentação"
          curl -sS -k -L -m 30 -A "$UA" "$B/ssl/parlamentar/documentation" -o /tmp/doc.html || true
          sed -e 's/<[^>]*>/ /g' /tmp/doc.html | tr -s ' \n' | head -c 2500
          echo
          curl -sS -k -L -m 30 -A "$UA" "$B/ssl/sessao-plenaria/proposicao-votada/documentation" -o /tmp/doc2.html || true
          sed -e 's/<[^>]*>/ /g' /tmp/doc2.html | tr -s ' \n' | head -c 2500
          echo
