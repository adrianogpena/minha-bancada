name: Testar o Transferegov (Emendas Pix)

# Teste manual, sem coleta nem commit: o Transferegov respondeu bloqueio do Cloudflare nas sessões na nuvem.
# Este job mostra se o runner do Actions (o IP que o coletor diário usa) é aceito, com o cliente padrão, sem disfarce.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar:
    name: Testar se o runner alcança a API do Transferegov
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Chamar a API
        run: |
          {
            echo "## Transferegov visto do runner do Actions"
            echo
            echo "IP do runner: $(curl -s -m 10 https://ipinfo.io/ip)"
            echo
            echo "| URL | Resultado | Começo da resposta |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          testar() {
            url="$1"
            corpo=$(mktemp)
            saida=$(curl -s -m 30 --retry 1 -H "Accept: application/json" -o "$corpo" -w "HTTP %{http_code}, %{size_download} bytes, %{content_type}" "$url" 2>&1) || saida="falha (curl $?)"
            inicio=$(head -c 160 "$corpo" | tr '\n|' '  ')
            echo "$url -> $saida :: $inicio"
            echo "| \`$url\` | $saida | \`$inicio\` |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$2" = "guardar" ]; then cp "$corpo" amostra.json; fi
          }
          base=https://api.transferegov.gestao.gov.br/transferenciasespeciais
          testar "$base/plano_acao_especial?limit=2" guardar
          testar "$base/programa_especial?limit=1"
          testar "$base/"
      - name: Campos do primeiro registro
        run: |
          if python3 -c "import json,sys; d=json.load(open('amostra.json')); assert isinstance(d,list) and d" 2>/dev/null; then
            {
              echo
              echo "### Campos de plano_acao_especial"
              echo '```'
              python3 -c "import json; d=json.load(open('amostra.json')); print(json.dumps(d[0], ensure_ascii=False, indent=1))"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Sem JSON: a API não respondeu como esperado (bloqueio ou mudança de endereço)." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
