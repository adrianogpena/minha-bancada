<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minha Bancada | Quem representa você, de vereador a presidente</title>
<meta name="description" content="Encontre todos os políticos com mandato no Brasil, de vereador a presidente, com dados oficiais do TSE, da Câmara e do Senado.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/estilo.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 9 9'%3E%3Crect width='4' height='4' fill='%232456c9'/%3E%3Crect x='5' width='4' height='4' fill='%23c13b1d'/%3E%3Crect y='5' width='4' height='4' fill='%23c13b1d'/%3E%3Crect x='5' y='5' width='4' height='4' fill='%232456c9'/%3E%3C/svg%3E">
</head>
<body data-pagina="inicio">
<main class="recipiente">
<section class="abertura">
  <h1>Quem representa você</h1>
  <p>Todos os políticos com mandato, de vereador a presidente. Clique no mapa para descer do Brasil ao seu estado e ao seu município.</p>
</section>
<div class="inicio">
  <section class="mapa-painel" aria-label="Mapa">
    <nav class="trilha" id="trilha" aria-label="Local escolhido"></nav>
    <div class="mapa" id="mapa"><p class="vazio">Carregando mapa…</p></div>
    <p class="dica" id="dica">Passe o mouse ou toque para ver o nome.</p>
  </section>
  <section class="lado" aria-label="Políticos">
    <div class="abas periodo" id="periodo" role="group" aria-label="Período"></div>
    <form class="filtros dois" role="search" onsubmit="return false">
      <label class="campo">Estado<select id="uf"><option value="">Brasil</option></select></label>
      <label class="campo">Município<select id="municipio" disabled><option value="">Todos os municípios</option></select></label>
      <label class="campo largo">Nome<input id="busca" type="search" placeholder="Ex.: Maria, PT, Campinas" autocomplete="off"></label>
    </form>
    <p class="contagem" id="contagem" aria-live="polite"></p>
    <details class="eleitorado" id="eleitorado" hidden></details>
    <div id="casas"></div>
    <div id="resultado"><p class="vazio">Carregando…</p></div>
  </section>
</div>
</main>
<script type="module" src="assets/app.js"></script>
</body>
</html>
