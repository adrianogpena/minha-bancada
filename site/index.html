<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minha Bancada | Como votam os deputados federais</title>
<meta name="description" content="Veja como cada deputado federal vota, o que propõe e quanto gasta, com dados oficiais da Câmara.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/estilo.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 9 9'%3E%3Crect width='4' height='4' fill='%232456c9'/%3E%3Crect x='5' width='4' height='4' fill='%23c13b1d'/%3E%3Crect y='5' width='4' height='4' fill='%23c13b1d'/%3E%3Crect x='5' y='5' width='4' height='4' fill='%232456c9'/%3E%3C/svg%3E">
</head>
<body data-pagina="inicio">
<main class="recipiente">
<section class="abertura">
  <h1>Veja como vota quem representa você</h1>
  <p>Votos no Plenário, projetos apresentados e gastos da cota parlamentar de cada deputado federal em exercício, com dados oficiais da Câmara atualizados todo dia.</p>
</section>
<form class="filtros" role="search" onsubmit="return false">
  <label class="campo">Nome do deputado<input id="busca" type="search" placeholder="Ex.: Maria" autocomplete="off"></label>
  <label class="campo">Estado<select id="uf"><option value="">Todos</option></select></label>
  <label class="campo">Partido<select id="partido"><option value="">Todos</option></select></label>
  <label class="campo">Ordenar por<select id="ordem">
    <option value="nome">Nome</option><option value="participacao">Quem mais votou</option>
    <option value="proposicoes">Mais proposições</option><option value="gasto">Maiores gastos</option></select></label>
</form>
<p class="contagem" id="contagem" aria-live="polite">Carregando…</p>
<div id="resultado"></div>
</main>
<script src="assets/app.js"></script>
</body>
</html>
