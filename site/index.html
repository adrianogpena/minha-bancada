<meta name="description" content="Encontre todos os políticos com mandato no Brasil, de vereador a presidente, com dados oficiais do TSE, da Câmara e do Senado.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body data-pagina="inicio">
<main class="recipiente">
<section class="abertura">
  <h1>Quem representa você</h1>
  <p>Todos os políticos com mandato, de vereador a presidente. Escolha seu estado e seu município para montar a sua bancada.</p>
</section>
<div class="abas periodo" id="periodo" role="group" aria-label="Período"></div>
<form class="filtros tres" role="search" onsubmit="return false">
  <label class="campo">Estado<select id="uf"><option value="">Escolha</option></select></label>
  <label class="campo">Município<select id="municipio" disabled><option value="">Todos os municípios</option></select></label>
  <label class="campo">Nome<input id="busca" type="search" placeholder="Ex.: Maria, PT, Campinas" autocomplete="off"></label>
</form>
<p class="contagem" id="contagem" aria-live="polite"></p>
<div id="resultado"><p class="vazio">Carregando…</p></div>
</main>
<script src="assets/app.js"></script>
</body>
</html>
